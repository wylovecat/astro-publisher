[package]
name = "astro-publisher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Content operations for an Astro blog: frontmatter, course outlines, chapter creation, validation, preview rendering."

[build-dependencies]
winresource.workspace = true

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
katex.workspace = true
regex.workspace = true
# Parsing KaTeX's own HTML back into a layout tree (`math_dom`). Both crates are
# already in the graph through gpui's text engine, so this adds no new build cost.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
chrono.workspace = true
directories.workspace = true
tokio.workspace = true
ureq.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "astro-publisher-core"
path = "src/bin/cli.rs"

