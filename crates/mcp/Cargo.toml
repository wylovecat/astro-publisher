[package]
name = "astro-publisher-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server exposing the Astro blog content operations to AI assistants."

[[bin]]
name = "astro-publisher-mcp"
path = "src/main.rs"

[build-dependencies]
winresource.workspace = true

[dependencies]
astro-publisher-core = { path = "../core" }
# The official Model Context Protocol SDK. `transport-io` is the stdio
# transport every desktop MCP client launches servers with.
rmcp = { version = "3", features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
